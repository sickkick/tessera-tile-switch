# A row for something that turns on and off, with the switch along the bottom of the tile.
id: tile_switch
version: 0.1.5
api: "0.8"
icon: toggle-switch
maintainer: sickkick
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 0

permissions:
  home_assistant_actions:
    - light.toggle
    - switch.toggle
    - input_boolean.toggle
    - fan.toggle
    - automation.toggle
    - remote.toggle
    - humidifier.toggle

tiles:
  - id: toggle
    name: tile_name
    icon: toggle-switch
    sizes: { min: 1x1, max: 4x2 }
    memory: 500
    domains: [light, switch, input_boolean, fan, automation, remote, humidifier]
    example: tile_example
    preview: { title: "{name}", value: "On" }
    options:
      - id: icon
        kind: choice
        label: icon
        hint: icon_hint
        default: auto
        choices:
          - { value: auto, label: icon_auto }
          - { value: lightbulb, label: icon_light }
          - { value: lightbulb-group, label: icon_lights }
          - { value: ceiling-light, label: icon_ceiling_light }
          - { value: ceiling-fan, label: icon_ceiling_fan }
          - { value: fan, label: icon_fan }
          - { value: lamp, label: icon_lamp }
          - { value: floor-lamp, label: icon_floor_lamp }
          - { value: desk-lamp, label: icon_desk_lamp }
          - { value: chandelier, label: icon_chandelier }
          - { value: spotlight-beam, label: icon_spotlight }
          - { value: led-strip-variant, label: icon_strip }
          - { value: outdoor-lamp, label: icon_outdoor }
          - { value: toggle-switch, label: icon_switch }
          - { value: power, label: icon_power }
          - { value: power-plug, label: icon_plug }
          - { value: air-humidifier, label: icon_humidifier }
          - { value: air-purifier, label: icon_purifier }
          - { value: script-text, label: icon_automation }
          - { value: remote, label: icon_remote }
